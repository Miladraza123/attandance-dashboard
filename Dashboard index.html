<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Attendance & Payroll</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #f5f2ec; color: #2a2622; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  header { background: #2a2622; color: #f5f2ec; padding: 20px 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  header .title-sm { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #c9a876; font-weight: 600; }
  header .title-lg { font-size: 22px; font-weight: 700; }
  nav { display: flex; gap: 4px; background: #3a352e; padding: 4px; border-radius: 8px; flex-wrap: wrap; }
  nav button { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; background: transparent; color: #f5f2ec; font-weight: 600; font-size: 13px; font-family: inherit; }
  nav button.active { background: #c9a876; color: #2a2622; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px; }
  .card { background: #fff; border: 1px solid #e2ddd2; border-radius: 10px; }
  .row-flex { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  label { font-size: 12px; color: #78716a; font-weight: 600; display: block; margin-bottom: 4px; }
  input, select { padding: 8px 10px; border: 1px solid #d8d2c4; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .btn { display: inline-flex; gap: 6px; align-items: center; border: none; padding: 9px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; height: 38px; font-size: 13px; font-family: inherit; }
  .btn-dark { background: #2a2622; color: #f5f2ec; }
  .btn-light { background: #fff; color: #2a2622; border: 1px solid #d8d2c4; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 9px 12px; text-align: left; }
  thead tr { background: #efe9dc; }
  tbody tr { border-top: 1px solid #efe9dc; }
  tfoot tr { border-top: 2px solid #2a2622; background: #efe9dc; font-weight: 700; }
  .list-row { display: flex; align-items: center; padding: 12px 16px; border-top: 1px solid #efe9dc; font-size: 13px; gap: 10px; }
  .list-row:first-child { border-top: none; }
  .del-btn { background: none; border: none; cursor: pointer; color: #a13a3a; font-size: 16px; }
  .error-bar { background: #f7e2e2; color: #a13a3a; padding: 10px 28px; font-size: 13px; }
  .muted { color: #78716a; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  h2 { font-size: 18px; margin-bottom: 16px; }
  h3 { font-size: 14px; margin-bottom: 8px; }
  @media print {
    .no-print { display: none !important; }
    body { background: white !important; }
  }
  @media (max-width: 640px) {
    header { padding: 14px 16px; }
    header .title-lg { font-size: 18px; }
    nav button { padding: 7px 10px; font-size: 12px; }
    main { padding: 14px; }
    .row-flex { flex-direction: column; align-items: stretch; }
    .row-flex > div { width: 100% !important; min-width: 0 !important; }
    input, select { width: 100%; }
    .btn { width: 100%; justify-content: center; }
    .list-row { flex-wrap: wrap; }
    h2 { font-size: 16px; }
    table { font-size: 11px; }
    th, td { padding: 7px 8px; }
  }
</style>
</head>
<body>

<header class="no-print">
  <div>
    <div class="title-sm">Live · Office Attendance &amp; Payroll</div>
    <div class="title-lg mono">SpeedFace V3L</div>
  </div>
  <nav id="navTabs">
    <button data-tab="report" class="active">Payroll Report</button>
    <button data-tab="employees">Employees</button>
    <button data-tab="holidays">Holidays &amp; Leaves</button>
    <button data-tab="policy">Policy</button>
  </nav>
</header>

<div id="errorBar" class="error-bar no-print" style="display:none;"></div>

<main>

  <!-- REPORT TAB -->
  <div id="tab-report" class="tab-content active">
    <div class="row-flex no-print" style="margin-bottom:16px;">
      <div><label>From</label><input type="date" id="startDate"></div>
      <div><label>To</label><input type="date" id="endDate"></div>
      <button class="btn btn-dark" id="btnGetReport">↻ Get Report</button>
      <div style="flex:1;"></div>
      <button class="btn btn-light" id="btnExportCSV">⬇ Export CSV</button>
      <button class="btn btn-light" id="btnPrint">🖨 Print</button>
    </div>
    <div class="muted" id="reportMeta" style="font-size:13px; margin-bottom:12px;"></div>
    <div class="card" style="overflow:auto;">
      <table style="min-width:1000px;">
        <thead>
          <tr>
            <th>Employee</th><th>Dept</th><th style="text-align:right;">Salary</th>
            <th style="text-align:center;">Present</th><th style="text-align:center;">Late</th>
            <th style="text-align:center;">Absent</th><th style="text-align:center;">Paid Lv</th>
            <th style="text-align:center;">Unpaid Lv</th><th style="text-align:center;">Warn 1-Punch</th>
            <th style="text-align:right;">Overtime</th><th style="text-align:right;">Deduction</th>
            <th style="text-align:right;">Net</th><th style="text-align:right;">Final Salary</th>
          </tr>
        </thead>
        <tbody id="reportBody"></tbody>
        <tfoot><tr id="reportTotals"></tr></tfoot>
      </table>
    </div>
  </div>

  <!-- EMPLOYEES TAB -->
  <div id="tab-employees" class="tab-content">
    <h2>Employees</h2>
    <div class="card no-print row-flex" style="padding:16px; margin-bottom:20px;">
      <div><label>Machine ID</label><input id="empMachineId"></div>
      <div style="flex:1; min-width:140px;"><label>Full Name</label><input id="empName"></div>
      <div><label>Department</label><input id="empDept"></div>
      <div><label>Salary</label><input type="number" id="empSalary"></div>
      <button class="btn btn-dark" id="btnAddEmp">+ Add</button>
    </div>
    <div class="card" id="employeesList"></div>
  </div>

  <!-- HOLIDAYS TAB -->
  <div id="tab-holidays" class="tab-content">
    <h2 style="margin-bottom:4px;">Holidays &amp; Leaves</h2>
    <div class="muted" style="font-size:13px; margin-bottom:20px;">Report nikalne se pehle system khud check karta hai.</div>

    <h3>Company Holiday</h3>
    <div class="card no-print row-flex" style="padding:16px; margin-bottom:16px;">
      <div><label>Date</label><input type="date" id="holDate"></div>
      <div style="flex:1; min-width:160px;"><label>Description</label><input id="holDesc"></div>
      <button class="btn btn-dark" id="btnAddHoliday">+ Add Holiday</button>
    </div>
    <div class="card" id="holidaysList" style="margin-bottom:28px;"></div>

    <h3>Employee Leave</h3>
    <div class="card no-print row-flex" style="padding:16px; margin-bottom:16px;">
      <div style="min-width:160px;"><label>Employee</label><select id="leaveEmp"><option value="">Select</option></select></div>
      <div><label>Date</label><input type="date" id="leaveDate"></div>
      <div><label>Type</label><select id="leaveType"><option value="paid">Paid</option><option value="unpaid">Unpaid</option></select></div>
      <div style="flex:1; min-width:140px;"><label>Reason</label><input id="leaveReason"></div>
      <button class="btn btn-dark" id="btnAddLeave">+ Add Leave</button>
    </div>
    <div class="card" id="leavesList"></div>
  </div>

  <!-- POLICY TAB -->
  <div id="tab-policy" class="tab-content">
    <h2>Final Policy (Locked)</h2>
    <div class="card" style="max-width:520px; padding:4px;" id="policyList"></div>
  </div>

</main>

<script>
const SUPABASE_URL = 'https://cqipkbxbrwcskqqltfft.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xxmJZtPaqVdoZ6OVdsXXLg_KEQcJ5hZ';
const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

async function sbGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
  return res.json();
}
async function sbPost(table, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method: 'POST', headers: { ...headers, Prefer: 'return=representation' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
  return res.json();
}
async function sbPatch(table, id, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'PATCH', headers, body: JSON.stringify(body) });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
}
async function sbDelete(table, id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'DELETE', headers });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
}
async function sbRpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args) });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
  return res.json();
}
function showError(msg) {
  const bar = document.getElementById('errorBar');
  bar.style.display = 'block';
  bar.textContent = '⚠ ' + msg;
}
function clearError() { document.getElementById('errorBar').style.display = 'none'; }

// ---- Tabs ----
document.getElementById('navTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('#navTabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
});

let employeesCache = [];
let reportCache = [];

// ---- Employees ----
async function loadEmployees() {
  try {
    employeesCache = await sbGet('employees?active=eq.true&order=full_name.asc');
    const list = document.getElementById('employeesList');
    list.innerHTML = employeesCache.map(e => `
      <div class="list-row">
        <div class="mono muted" style="width:60px;">#${e.machine_user_id}</div>
        <div style="flex:1; font-weight:600;">${e.full_name}</div>
        <div class="muted" style="width:120px;">${e.department || ''}</div>
        <div class="mono muted" style="width:110px;">Rs. ${Number(e.monthly_salary).toLocaleString()}</div>
        <button class="del-btn no-print" onclick="removeEmployee('${e.id}')">🗑</button>
      </div>`).join('') || '<div style="padding:16px; font-size:13px; color:#a89f8f;">Koi employee nahi.</div>';

    const sel = document.getElementById('leaveEmp');
    sel.innerHTML = '<option value="">Select</option>' + employeesCache.map(e => `<option value="${e.id}">${e.full_name}</option>`).join('');
  } catch (e) { showError(e.message); }
}
async function removeEmployee(id) {
  try { await sbPatch('employees', id, { active: false }); loadEmployees(); } catch (e) { showError(e.message); }
}
document.getElementById('btnAddEmp').addEventListener('click', async () => {
  const machine_user_id = document.getElementById('empMachineId').value.trim();
  const full_name = document.getElementById('empName').value.trim();
  const department = document.getElementById('empDept').value.trim();
  const monthly_salary = Number(document.getElementById('empSalary').value) || 0;
  if (!machine_user_id || !full_name) return;
  try {
    clearError();
    await sbPost('employees', { machine_user_id, full_name, department, monthly_salary });
    document.getElementById('empMachineId').value = '';
    document.getElementById('empName').value = '';
    document.getElementById('empDept').value = '';
    document.getElementById('empSalary').value = '';
    loadEmployees();
  } catch (e) { showError(e.message); }
});

// ---- Holidays ----
async function loadHolidays() {
  try {
    const holidays = await sbGet('company_holidays?order=holiday_date.asc');
    document.getElementById('holidaysList').innerHTML = holidays.map(h => `
      <div class="list-row">
        <div class="mono muted" style="width:120px;">${h.holiday_date}</div>
        <div style="flex:1; font-weight:600;">${h.description || ''}</div>
        <button class="del-btn no-print" onclick="removeHoliday('${h.id}')">🗑</button>
      </div>`).join('') || '<div style="padding:16px; font-size:13px; color:#a89f8f;">Koi holiday nahi.</div>';
  } catch (e) { showError(e.message); }
}
async function removeHoliday(id) {
  try { await sbDelete('company_holidays', id); loadHolidays(); } catch (e) { showError(e.message); }
}
document.getElementById('btnAddHoliday').addEventListener('click', async () => {
  const holiday_date = document.getElementById('holDate').value;
  const description = document.getElementById('holDesc').value.trim();
  if (!holiday_date) return;
  try {
    clearError();
    await sbPost('company_holidays', { holiday_date, description });
    document.getElementById('holDate').value = '';
    document.getElementById('holDesc').value = '';
    loadHolidays();
  } catch (e) { showError(e.message); }
});

// ---- Leaves ----
async function loadLeaves() {
  try {
    const leaves = await sbGet('employee_leaves?select=*,employees(full_name)&order=leave_date.desc');
    document.getElementById('leavesList').innerHTML = leaves.map(l => `
      <div class="list-row">
        <div class="mono muted" style="width:120px;">${l.leave_date}</div>
        <div style="width:140px; font-weight:600;">${l.employees ? l.employees.full_name : ''}</div>
        <div style="width:80px; font-weight:700; color:${l.paid ? '#2f6844' : '#a13a3a'};">${l.paid ? 'Paid' : 'Unpaid'}</div>
        <div style="flex:1;" class="muted">${l.reason || ''}</div>
        <button class="del-btn no-print" onclick="removeLeave('${l.id}')">🗑</button>
      </div>`).join('') || '<div style="padding:16px; font-size:13px; color:#a89f8f;">Koi leave nahi.</div>';
  } catch (e) { showError(e.message); }
}
async function removeLeave(id) {
  try { await sbDelete('employee_leaves', id); loadLeaves(); } catch (e) { showError(e.message); }
}
document.getElementById('btnAddLeave').addEventListener('click', async () => {
  const employee_id = document.getElementById('leaveEmp').value;
  const leave_date = document.getElementById('leaveDate').value;
  const paid = document.getElementById('leaveType').value === 'paid';
  const reason = document.getElementById('leaveReason').value.trim();
  if (!employee_id || !leave_date) return;
  try {
    clearError();
    await sbPost('employee_leaves', { employee_id, leave_date, paid, reason });
    document.getElementById('leaveDate').value = '';
    document.getElementById('leaveReason').value = '';
    loadLeaves();
  } catch (e) { showError(e.message); }
});

// ---- Report ----
function fmt(n) { return Number(n || 0).toLocaleString(); }

async function loadReport() {
  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;
  document.getElementById('btnGetReport').textContent = '↻ Loading...';
  try {
    clearError();
    reportCache = await sbRpc('compute_range_payroll', { start_date: startDate, end_date: endDate });
    renderReport(startDate, endDate);
  } catch (e) { showError(e.message); }
  document.getElementById('btnGetReport').textContent = '↻ Get Report';
}

function renderReport(startDate, endDate) {
  document.getElementById('reportMeta').textContent = `${startDate} se ${endDate} tak — ${reportCache.length} employees`;
  const body = document.getElementById('reportBody');
  body.innerHTML = reportCache.map(r => `
    <tr>
      <td style="font-weight:600;">${r.employee_name}</td>
      <td class="muted">${r.department || ''}</td>
      <td class="mono" style="text-align:right;">${fmt(r.monthly_salary)}</td>
      <td style="text-align:center; color:#2f6844; font-weight:700;">${r.present_days}</td>
      <td style="text-align:center; color:#a6650a; font-weight:700;">${r.total_late_days}</td>
      <td style="text-align:center; color:#a13a3a; font-weight:700;">${r.total_absent_days}</td>
      <td style="text-align:center;">${r.paid_leave_days}</td>
      <td style="text-align:center;">${r.unpaid_leave_days}</td>
      <td style="text-align:center; font-weight:700; color:${r.single_punch_days > 0 ? '#c23b3b' : '#a89f8f'};">${r.single_punch_days || '—'}</td>
      <td class="mono" style="text-align:right; color:#2f6844; font-weight:600;">+${fmt(r.overtime_pay)}</td>
      <td class="mono" style="text-align:right; color:#a13a3a; font-weight:600;">-${fmt(Number(r.late_deduction) + Number(r.absent_deduction))}</td>
      <td class="mono" style="text-align:right; font-weight:700; color:${Number(r.net_adjustment) >= 0 ? '#2f6844' : '#a13a3a'};">${Number(r.net_adjustment) >= 0 ? '+' : ''}${fmt(r.net_adjustment)}</td>
      <td class="mono" style="text-align:right; font-weight:700;">Rs. ${fmt(r.final_salary)}</td>
    </tr>`).join('');

  const totals = reportCache.reduce((acc, r) => {
    acc.salary += Number(r.monthly_salary) || 0;
    acc.overtime += Number(r.overtime_pay) || 0;
    acc.deduction += (Number(r.late_deduction) || 0) + (Number(r.absent_deduction) || 0);
    acc.final += Number(r.final_salary) || 0;
    return acc;
  }, { salary: 0, overtime: 0, deduction: 0, final: 0 });

  document.getElementById('reportTotals').innerHTML = `
    <td colspan="2">TOTAL</td>
    <td class="mono" style="text-align:right;">${fmt(totals.salary)}</td>
    <td colspan="5"></td>
    <td class="mono" style="text-align:right; color:#2f6844;">+${fmt(totals.overtime)}</td>
    <td class="mono" style="text-align:right; color:#a13a3a;">-${fmt(totals.deduction)}</td>
    <td></td>
    <td class="mono" style="text-align:right;">Rs. ${fmt(totals.final)}</td>`;
}

document.getElementById('btnGetReport').addEventListener('click', loadReport);

document.getElementById('btnExportCSV').addEventListener('click', () => {
  const rows = [['Employee','Department','Salary','Present','Late','Absent','Paid Leave','Unpaid Leave','Single Punch','Overtime','Late Ded.','Absent Ded.','Net','Final Salary']];
  reportCache.forEach(r => rows.push([r.employee_name, r.department, r.monthly_salary, r.present_days, r.total_late_days, r.total_absent_days, r.paid_leave_days, r.unpaid_leave_days, r.single_punch_days, r.overtime_pay, r.late_deduction, r.absent_deduction, r.net_adjustment, r.final_salary]));
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `payroll-${document.getElementById('startDate').value}-to-${document.getElementById('endDate').value}.csv`;
  a.click();
});
document.getElementById('btnPrint').addEventListener('click', () => window.print());

// ---- Policy ----
const policy = [
  ['Office Timing', '11:00 AM – 08:00 PM'],
  ['Weekly Off', 'Sunday'],
  ['Late Grace Period', '30 minutes'],
  ['Free Late / Month', 'Pehle 3 late maaf'],
  ['Late Deduction', '4th late se, minute-wise'],
  ['Free Absent / Month', 'Pehla absent maaf'],
  ['Absent Deduction', '2nd absent se, poore din ki'],
  ['Overtime Starts', 'End time ke 30 min baad'],
  ['Overtime Rule', 'Jis din late ho, us din overtime nahi'],
  ['Overtime Pay', 'Minute-wise, salary rate ke barabar'],
  ['Total Working Minutes/Month', '14,580'],
];
document.getElementById('policyList').innerHTML = policy.map(([k, v], i) => `
  <div style="display:flex; justify-content:space-between; padding:10px 16px; ${i > 0 ? 'border-top:1px solid #efe9dc;' : ''} font-size:13px;">
    <span class="muted">${k}</span><span style="font-weight:600;">${v}</span>
  </div>`).join('');

// ---- Init ----
function todayISO() { return new Date().toISOString().slice(0, 10); }
function firstOfMonthISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; }
document.getElementById('startDate').value = firstOfMonthISO();
document.getElementById('endDate').value = todayISO();

loadEmployees();
loadHolidays();
loadLeaves();
loadReport();
</script>

</body>
</html>
