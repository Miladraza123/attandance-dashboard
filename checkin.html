<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Duty Check-In</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #f5f2ec; color: #2a2622; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 14px; padding: 28px 24px; max-width: 400px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .title { font-size: 20px; font-weight: 700; margin-bottom: 4px; text-align: center; }
  .sub { font-size: 13px; color: #78716a; text-align: center; margin-bottom: 24px; }
  label { font-size: 13px; color: #78716a; font-weight: 600; display: block; margin-bottom: 6px; }
  select, textarea { width: 100%; padding: 12px; border: 1px solid #d8d2c4; border-radius: 8px; font-size: 15px; font-family: inherit; margin-bottom: 16px; }
  textarea { resize: vertical; min-height: 60px; }
  .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; font-family: inherit; }
  .btn-in { background: #2f6844; color: #fff; }
  .btn-out { background: #a6650a; color: #fff; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
  .status.error { background: #f7e2e2; color: #a13a3a; display: block; }
  .status.success { background: #e7f2eb; color: #2f6844; display: block; }
  .status.loading { background: #efe9dc; color: #78716a; display: block; }
  .current-status { background: #efe9dc; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="title">📍 Field Duty Check-In</div>
  <div class="sub">Apna naam select karein aur punch karein — system waqt dekh kar khud check-in ya check-out samjh lega</div>

  <label>Apna Naam</label>
  <select id="empSelect"><option value="">-- Select --</option></select>

  <div id="currentStatus" class="current-status"></div>

  <label id="noteLabel" style="display:none;">Wajah / Note (optional)</label>
  <textarea id="noteInput" placeholder="jaise: Customer XYZ ko delivery" style="display:none;"></textarea>

  <button class="btn btn-in" id="actionBtn" disabled>Pehle naam select karein</button>

  <div id="statusMsg" class="status"></div>
</div>

<script>
const SUPABASE_URL = 'https://cqipkbxbrwcskqqltfft.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xxmJZtPaqVdoZ6OVdsXXLg_KEQcJ5hZ';
const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

// ===== Timing rules (fixed) =====
// 11:00–16:00  => Check-in window
// 16:00–02:00 (agle din) => Check-out window (koi upper time-limit nahi, sirf 2 AM tak)
// 02:00–11:00 => Dead zone, koi punch nahi

async function sbGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers });
  if (!res.ok) throw new Error((await res.text()) || res.statusText);
  return res.json();
}
async function sbPost(table, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method: 'POST', headers: { ...headers, Prefer: 'return=representation' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error((await res.text()) || res.statusText);
  return res.json();
}
async function sbPatch(table, id, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'PATCH', headers, body: JSON.stringify(body) });
  if (!res.ok) throw new Error((await res.text()) || res.statusText);
}

let employees = [];
let activeRecord = null; // aaj/raat ka open (non-rejected) record, agar hai
let machineCheckedInState = false;

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function karachiParts() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Karachi', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(now);
  const get = (t) => parts.find(p => p.type === t).value;
  return { date: `${get('year')}-${get('month')}-${get('day')}`, hm: `${get('hour')}:${get('minute')}` };
}

// Konsa "duty date" hai abhi? Raat 02:00 se pehle ho to pichle din ka hi cycle maana jayega
function currentDutyDate() {
  const { date, hm } = karachiParts();
  if (hm < '02:00') {
    const d = new Date(date + 'T00:00:00');
    d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return date;
}

function currentMode() {
  // returns 'checkin' | 'checkout' | 'blocked'
  const { hm } = karachiParts();
  if (hm >= '11:00' && hm < '16:00') return 'checkin';
  if (hm >= '16:00' || hm < '02:00') return 'checkout';
  return 'blocked';
}

async function init() {
  try {
    employees = await sbGet('employees?active=eq.true&order=full_name.asc');
    const sel = document.getElementById('empSelect');
    sel.innerHTML = '<option value="">-- Select --</option>' + employees.map(e => `<option value="${e.id}">${e.full_name}</option>`).join('');
  } catch (e) {
    showStatus('Load error: ' + e.message, 'error');
  }
}

async function getMachineStatusToday(empId) {
  const emp = employees.find(e => e.id === empId);
  if (!emp) return 'none';
  const today = karachiParts().date;
  try {
    const rows = await sbGet(`attendance_logs?machine_user_id=eq.${emp.machine_user_id}&punch_time=gte.${today}T00:00:00&order=punch_time.desc&limit=1`);
    if (rows.length === 0) return 'none';
    const lastPunchTime = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Karachi', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(rows[0].punch_time));
    // Agar aakhri punch 4 PM se pehle hai — matlab sirf subah ka check-in hua, checkout abhi baaki
    // Agar 4 PM ke baad hai — matlab sham ka checkout bhi ho chuka, din mukammal hai
    return lastPunchTime < '16:00' ? 'checkin_only' : 'complete';
  } catch { return 'none'; }
}

document.getElementById('empSelect').addEventListener('change', async (e) => {
  const empId = e.target.value;
  const btn = document.getElementById('actionBtn');
  const noteLabel = document.getElementById('noteLabel');
  const noteInput = document.getElementById('noteInput');
  const statusBox = document.getElementById('currentStatus');
  document.getElementById('statusMsg').className = 'status';

  if (!empId) {
    btn.disabled = true;
    btn.textContent = 'Pehle naam select karein';
    statusBox.style.display = 'none';
    noteLabel.style.display = 'none';
    noteInput.style.display = 'none';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Loading...';

  try {
    const dutyDate = currentDutyDate();
    // Sirf REJECTED nahi wale records dekhein — reject hone par employee fresh shuru kar sake
    // checkin_time null bhi ho sakta hai (checkout-only record), isliye checkout_time pe bhi check karein
    const rows = await sbGet(`field_checkins?employee_id=eq.${empId}&status=neq.rejected&or=(checkin_time.gte.${dutyDate}T00:00:00,checkout_time.gte.${dutyDate}T00:00:00)&order=checkin_time.desc.nullslast&limit=5`);
    activeRecord = rows.find(r => !r.checkout_time) || null;
    const completedToday = rows.find(r => r.checkout_time) || null;
    const machineStatus = !activeRecord && !completedToday ? await getMachineStatusToday(empId) : 'none';
    machineCheckedInState = machineStatus === 'checkin_only';

    const mode = currentMode();

    if (mode === 'blocked') {
      btn.disabled = true;
      btn.textContent = 'Abhi punch window nahi hai (02:00–11:00)';
      statusBox.style.display = 'none';
      noteLabel.style.display = 'none';
      noteInput.style.display = 'none';
    } else if (activeRecord && !activeRecord.checkout_time) {
      // Check-in ho chuka hai, ab check-out
      btn.className = 'btn btn-out';
      btn.textContent = '🚪 Check Out';
      btn.disabled = false;
      statusBox.style.display = 'block';
      statusBox.innerHTML = `✓ Aap ${activeRecord.checkin_time ? new Date(activeRecord.checkin_time).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Karachi'}) + ' par' : ''} check-in kar chuke hain. Ab check-out kar sakte hain (raat 2 baje tak).`;
      noteLabel.style.display = 'none';
      noteInput.style.display = 'none';
    } else if (completedToday) {
      // Aaj ka cycle mukammal ho chuka hai
      btn.disabled = true;
      btn.className = 'btn btn-in';
      btn.textContent = 'Aaj ka field duty record mukammal ho chuka hai';
      statusBox.style.display = 'block';
      const inTxt = completedToday.checkin_time
        ? new Date(completedToday.checkin_time).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Karachi'})
        : (completedToday.checkin_missing ? '⚠ Check-in missing' : '✓ Check-in via Machine');
      const outTxt = new Date(completedToday.checkout_time).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Karachi'});
      statusBox.innerHTML = `✓ Aaj mukammal ho chuka hai (${inTxt} → ${outTxt})`;
      noteLabel.style.display = 'none';
      noteInput.style.display = 'none';
    } else if (machineStatus === 'complete') {
      // Machine se hi poora din (check-in + check-out) ho chuka hai — kuch karne ki zaroorat nahi
      btn.disabled = true;
      btn.className = 'btn btn-in';
      btn.textContent = 'Aaj ka record machine se mukammal ho chuka hai';
      statusBox.style.display = 'block';
      statusBox.innerHTML = `✓ Aapka aaj ka check-in aur check-out dono machine se ho chuke hain. Yahan kuch karne ki zaroorat nahi.`;
      noteLabel.style.display = 'none';
      noteInput.style.display = 'none';
    } else if (machineStatus === 'checkin_only') {
      // Machine par pehle se Check-in ho chuka hai — sirf Check-out ka option
      btn.className = 'btn btn-out';
      btn.textContent = '🚪 Check Out (Machine se Check-in mil chuka hai)';
      btn.disabled = false;
      statusBox.style.display = 'block';
      statusBox.innerHTML = `✓ Aap machine par aaj already check-in kar chuke hain. Yahan sirf Check-out karein.`;
      noteLabel.style.display = 'block';
      noteInput.style.display = 'block';
    } else if (mode === 'checkin') {
      btn.className = 'btn btn-in';
      btn.textContent = '📍 Check In';
      btn.disabled = false;
      statusBox.style.display = 'none';
      noteLabel.style.display = 'block';
      noteInput.style.display = 'block';
    } else {
      // mode === 'checkout' but no open check-in record — check-in miss ho gaya
      btn.className = 'btn btn-out';
      btn.textContent = '🚪 Check Out (Check-in miss ho gaya tha)';
      btn.disabled = false;
      statusBox.style.display = 'block';
      statusBox.innerHTML = `⚠ Aaj ka Check-in record nahi mila. Ye Check-out "Check-in Missing" ke saath record hoga.`;
      noteLabel.style.display = 'block';
      noteInput.style.display = 'block';
    }
  } catch (err) {
    showStatus('Error: ' + err.message, 'error');
    btn.disabled = true;
  }
});

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('Ye browser location support nahi karta')); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      (err) => reject(new Error('Location allow karna zaroori hai. (' + err.message + ')')),
      { enableHighAccuracy: true, timeout: 15000 }
    );
  });
}

async function reverseGeocode(lat, lng) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`);
    const data = await res.json();
    return data.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  } catch {
    return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }
}

async function getOfficeRules() {
  try {
    const rows = await sbGet('attendance_rules?id=eq.1');
    return rows[0];
  } catch { return null; }
}

function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

document.getElementById('actionBtn').addEventListener('click', async () => {
  const empId = document.getElementById('empSelect').value;
  const btn = document.getElementById('actionBtn');
  if (!empId) return;

  const mode = currentMode();
  if (mode === 'blocked') { showStatus('Abhi punch window nahi hai.', 'error'); return; }

  btn.disabled = true;
  showStatus('📍 Location le rahe hain...', 'loading');

  try {
    const loc = await getLocation();
    const isCheckout = activeRecord && !activeRecord.checkout_time;

    if (isCheckout) {
      showStatus('Check-out ho raha hai...', 'loading');
      await sbPatch('field_checkins', activeRecord.id, {
        checkout_time: new Date().toISOString(),
        checkout_lat: loc.lat,
        checkout_lng: loc.lng,
      });
      showStatus('✓ Check-out ho gaya! Shukriya.', 'success');
      btn.textContent = 'Mukammal ho gaya';
    } else if (machineCheckedInState) {
      // Machine ne pehle se Check-in kar diya hai — sirf Check-out record karein
      showStatus('Check-out save ho raha hai...', 'loading');
      await sbPost('field_checkins', {
        employee_id: empId,
        checkin_time: null,
        checkout_time: new Date().toISOString(),
        checkout_lat: loc.lat,
        checkout_lng: loc.lng,
        note: document.getElementById('noteInput').value.trim() || 'Machine se check-in, field se check-out',
        status: 'pending',
        checkin_missing: false,
      });
      showStatus('✓ Check-out ho gaya! Manager ki approval ka intezar hai.', 'success');
      btn.disabled = true;
      btn.textContent = 'Mukammal ho gaya';
    } else if (mode === 'checkin') {
      showStatus('Address dhoondi ja rahi hai...', 'loading');
      const address = await reverseGeocode(loc.lat, loc.lng);
      const rules = await getOfficeRules();

      let nearOffice = false;
      if (rules && rules.office_lat && rules.office_lng) {
        const dist = haversineMeters(loc.lat, loc.lng, rules.office_lat, rules.office_lng);
        nearOffice = dist <= (rules.office_radius_meters || 200);
      }

      showStatus('Check-in save ho raha hai...', 'loading');
      const created = await sbPost('field_checkins', {
        employee_id: empId,
        checkin_time: new Date().toISOString(),
        checkin_lat: loc.lat,
        checkin_lng: loc.lng,
        checkin_address: address,
        note: document.getElementById('noteInput').value.trim(),
        status: 'pending',
        near_office: nearOffice,
      });
      activeRecord = created[0];
      showStatus('✓ Check-in ho gaya! Manager ki approval ka intezar hai.', 'success');
      btn.className = 'btn btn-out';
      btn.textContent = '🚪 Check Out';
      btn.disabled = false;
      document.getElementById('noteLabel').style.display = 'none';
      document.getElementById('noteInput').style.display = 'none';
    } else {
      // Checkout without prior check-in — checkin_missing record
      showStatus('Check-out save ho raha hai...', 'loading');
      await sbPost('field_checkins', {
        employee_id: empId,
        checkin_time: null,
        checkout_time: new Date().toISOString(),
        checkout_lat: loc.lat,
        checkout_lng: loc.lng,
        note: document.getElementById('noteInput').value.trim(),
        status: 'pending',
        checkin_missing: true,
      });
      showStatus('✓ Check-out ho gaya (Check-in Missing flag ke saath). Manager review karega.', 'success');
      btn.disabled = true;
      btn.textContent = 'Mukammal ho gaya';
    }
  } catch (e) {
    showStatus('❌ ' + e.message, 'error');
    btn.disabled = false;
  }
});

init();
</script>

</body>
</html>
